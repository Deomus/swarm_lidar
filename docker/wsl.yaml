# Дополнение для WSL2 и Docker Desktop на Windows: видеокарта через D3D12
# (/dev/dxg, /usr/lib/wsl; sitl.py сам включает GALLIUM_DRIVER=d3d12 на NVIDIA)
# и окна через WSLg. WSLG_DIR: /mnt/wslg из дистрибутива WSL,
# /run/desktop/mnt/host/wslg из PowerShell (задают docker/run.sh и run.ps1).

x-gpu: &gpu
  devices: [/dev/dxg]

services:
  sim:
    <<: *gpu
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
    environment:
      LD_LIBRARY_PATH: /usr/lib/wsl/lib

  sim-gui:
    <<: *gpu
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - ${WSLG_DIR:-/mnt/wslg}:/mnt/wslg
      - ${WSLG_DIR:-/mnt/wslg}/.X11-unix:/tmp/.X11-unix
    environment:
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: /mnt/wslg/runtime-dir
      PULSE_SERVER: /mnt/wslg/PulseServer
