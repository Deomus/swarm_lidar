mission_planner:
  ros__parameters:
    use_sim_time: true
    working_altitude: 3.0
    formation_radius: 6.0
    safety_margin: 0.75
    pose_timeout: 0.5
    occupancy_threshold: 50
    max_map_cells: 40000
    require_formation_geometry: true
    geometry_timeout: 0.5
    # Не ниже: при меньшей высоте земля входит в полосу поиска ведомых LiDAR
    # (датчик на 1,9 м выше корпуса, полоса 1,0–2,9 м ниже датчика) с запасом.
    min_altitude: 2.0
    max_altitude: 30.0
