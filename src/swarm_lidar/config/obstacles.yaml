# Столбы-препятствия площадки (модель pillar: радиус 0,6 м, высота 10 м).
# Единственный источник для /map (training_map); позы в worlds/*.sdf
# проверяет test_pillars.py. Стена на x=18 м перекрывает прямой путь
# на восток: цель за ней, например (35; 0), A* обходит с запасом под строй.
radius: 0.6
height: 10.0
pillars:
  - [18.0, -12.0]
  - [18.0, -4.0]
  - [18.0, 4.0]
  - [18.0, 12.0]
  - [-15.0, 15.0]
  - [8.0, -20.0]
