# Столбы-препятствия площадки (модель pillar: радиус 0,6 м, высота 10 м).
# Единственный источник для /map (training_map); позы в worlds/*.sdf
# проверяет test_pillars.py. Стена на y=−18 м перекрывает прямой путь на юг:
# цель за ней, например (0; −35), A* обходит с запасом под строй. Столбы стоят
# вне путей S1/S2/S3 (S2 уходит на восток вдоль оси X).
radius: 0.6
height: 10.0
pillars:
  - [-12.0, -18.0]
  - [-4.0, -18.0]
  - [4.0, -18.0]
  - [12.0, -18.0]
  - [-20.0, 12.0]
  - [-25.0, -40.0]
