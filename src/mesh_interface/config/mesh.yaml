mesh_interface:
  ros__parameters:
    poses_in: /swarm/relative_poses
    poses_out: /mesh/relative_poses
    states_in: /swarm/states
    states_out: /mesh/states
    commands_in: /swarm/commands
    commands_out: /mesh/commands
    # План строя от ведущего ведомым и их статусы обратно.
    plan_in: /swarm/formation_plan
    plan_out: /mesh/formation_plan
    follower_status_in: /swarm/follower_status
    follower_status_out: /mesh/follower_status
    delay: 0.0
    jitter: 0.0
    loss: 0.0
    capacity: 1000
    seed: 42
    period: 0.01
    qos_depth: 10
    drop_duration: 0.7
    # 0 — сервис потери гасит позы всех целей, 1..3 — только этого ведомого.
    drop_target_id: 0

