formation_controller:
  ros__parameters:
    period: 0.05
    kp: 0.3
    vertical_kp: 0.6
    vertical_kd: 0.6
    vertical_derivative_time: 0.2
    stale_timeout: 0.5
    min_confidence: 0.4
    max_speed: 2.0
    max_acceleration: 4.0
    max_jerk: 8.0
    velocity_smoothing: windowed
    # Упреждение — заданная ведущему команда из mesh, без сглаживания;
    # сглаживается только поправка по LiDAR, выход ограничен по ускорению.
    leader_commands_topic: /mesh/commands
    min_separation: 2.0
    warning_distance: 3.0
    repulsion_gain: 0.5
    gap: 4.0
    surface_bias: 0.0
    sensor_offset: [0.0, 0.0, 1.9]
    marker_offset_z: 0.0
    # Ведомые держат курс лидера: упреждение его yaw_rate и P по ошибке курса.
    match_leader_yaw: true
    yaw_gain: 1.0
    max_yaw_rate: 0.3
    require_transition_map: true
    transition_map_margin: 0.75
    leader_status_topic: /mission/execution_status
    poses_topic: /mesh/relative_poses
    states_topic: /mesh/states
    commands_topic: /swarm/commands
    formation_topic: /swarm/formation_command
    status_topic: /swarm/formation_status
    target_topic: /swarm/target_offsets

